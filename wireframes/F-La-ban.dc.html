<x-dc>

<style>
body{margin:0}
a{color:#333}a:hover{color:#000}

.bar{height:10px;background:#d4d4d4;border-radius:2px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#555}
.btn{border:1.5px solid #222;background:#fff;color:#222;padding:12px 18px;font-size:14px;min-height:44px;box-sizing:border-box;font-family:inherit}
.btn-p{background:#222;color:#fff}

<div style="width: 1280px; height: 1100px; box-sizing: border-box; background: #ffffff; color: #222; font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column">

        <circle cx="610" cy="190" r="6" fill="#666"></circle>
        <circle cx="90" cy="380" r="12" fill="#666"></circle>

      <div style="position: absolute; width: 220px; text-align: center; display: flex; flex-direction: column; gap: 4px">
        <div class="lbl">Kim chỉ</div>
        <div style="font-size: 52px; font-weight: 800; line-height: 1">2026</div>
        <div class="lbl">[giá] · lật [n]×</div>
      </div>
      <div class="lbl" style="position: absolute; left: 40px; bottom: 32px">Vòng 1 Liber I · Vòng 2 Liber II · Vòng 3 Liber III · Viền Liber IV</div>
